[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-agent"
version = "1.0.0"
description = "HH.ru Harness Agent with Two-Tier LLM Architecture (Qwen 2.5 7B Local + NVIDIA NIM Cloud)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.scripts]
hh-agent = "hh_agent.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
