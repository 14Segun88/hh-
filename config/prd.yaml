facts:
  # Мульти-агентные системы и оркестрация (ai, agents, llm)
  - id: multi_agent_systems
    tags: [ai, agents, llm, architecture]
    text: "Проектирование и запуск мульти-агентных систем в production: архитектура из 8 специализированных AI-агентов с динамической маршрутизацией на базе Llama-3.3-70B (проект MOGE, сокращение времени экспертизы с 12-42 дней до 5-10 минут)."

  - id: cot_reasoning_and_extraction
    tags: [ai, llm, reasoning, nlp]
    text: "Разработка многошаговых Chain-of-Thought (CoT) пайплайнов для сложного извлечения структурированных данных из неструктурированных PDF с верификацией через Knowledge Base (проект PD Document Analyzer, точность 100% на известных документах)."

  - id: rag_and_vector_databases
    tags: [ai, rag, vector_db, search]
    text: "Построение гибридных RAG-пайплайнов (BM25 + Vector Search) по нормативной документации в векторной базе Weaviate, работа с эмбеддингами через sentence-transformers."

  - id: llm_endpoints_and_local_models
    tags: [ai, llm, infra, local]
    text: "Глубокая практическая работа как с локальными LLM через LM Studio / Ollama (Mistral 14B Reasoning, Qwen 2.5), так и с облачными API (NVIDIA NIM, Groq Cloud, OpenAI API, Hugging Face)."

  - id: fine_tuning_and_quantization
    tags: [ai, ml, qlora, models]
    text: "Пайплайны дообучения моделей QLoRA (Qwen2.5-3B → квантование в GGUF) для кастомных доменных задач и офлайн-развертывания."

  - id: ml_hybrid_systems
    tags: [ml, pytorch, catboost, ai]
    text: "Разработка гибридных ML-систем: объединение табличных данных (139 фичей), эмбеддингов знаний и сентимента через PyTorch Fusion Network + специализированные ансамбли CatBoost (проект News Predictor AI)."

  - id: backend_and_async
    tags: [backend, python, web]
    text: "Python 3.10+, FastAPI, Flask, Asyncio, SQLAlchemy, Docker, Linux, Git, проектирование надежных микросервисов и интеграционных REST API."

  - id: browser_automation_playwright
    tags: [automation, scraping, playwright]
    text: "Парсинг и автоматизация браузера на Playwright: сбор данных с финансовых порталов, автоматическая проверка реестров (НОПРИЗ) в headless-режиме."

  - id: telegram_bots_interfaces
    tags: [backend, bots, ui]
    text: "Разработка асинхронных интерфейсов взаимодействия с AI-системами через Telegram Bot API (aiogram) для загрузки файлов и выдачи аналитических отчетов."

  - id: github_portfolio
    tags: [portfolio, code, github]
    text: "Открытое портфолио с production-кодом на GitHub (14Segun88): moge-document-expertise-ai, pd-document-analyzer, news-predictor-ai."

