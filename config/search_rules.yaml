# ==============================================================================
# ПРАВИЛА ПОИСКА И ФИЛЬТРАЦИИ ВАКАНСИЙ (SEARCH & FILTER RULES)
# ==============================================================================

search:
  # Поисковые фразы для hh.ru (выполняются последовательно)
  queries:
    - "Python Senior"
    - "Python Team Lead"
    - "FastAPI Developer"
    - "Backend Developer Python"

  # Регион поиска: 113 - вся Россия, 1 - Москва, 2 - Санкт-Петербург (можно дополнять)
  area_id: 113

  # Формат: remote (только удаленка) или all
  only_remote: true

  # Сортировка: publication_time (по новизне, вчера + сегодня)
  order_by: "publication_time"

  # Опыт работы: "between3And6", "moreThan6", "between1And3"
  experience:
    - "between3And6"
    - "moreThan6"

# Стоп-слова: моментальное отклонение вакансии до обращения к нейронкам (экономия ресурсов)
hard_stop_words:
  - "1C"
  - "1С"
  - "Битрикс"
  - "Bitrix"
  - "Junior"
  - "Джуниор"
  - "Стажер"
  - "Стажировка"
  - "PHP"
  - "WordPress"
  - "Холодные звонки"
  - "Продажи"
  - "Сетевой маркетинг"
  - "Crypto trading bot scams"

# Красные флаги для анализа локальной Qwen (снижают оценку вакансии):
red_flag_phrases:
  - "ненормированный рабочий день"
  - "готовность быть на связи 24/7"
  - "стрессоустойчивость"
  - "молодая динамично развивающаяся семья"
  - "система штрафов"
  - "оклад 30 000 + процент"
  - "серая зарплата"
  - "оплата в конверте"
  - "работа за процент от будущей прибыли"

# Пороги принятия решений:
thresholds:
  # Если локальная Qwen ставит оценку ниже этого порога, вакансия сразу архивируется как skipped
  min_score_to_consider: 60
  # Если оценка >= threshold_nim, отправляем на глубокий анализ в NVIDIA NIM (досье, вердикт, письмо)
  min_score_for_nim_dossier: 70
