# ==============================================================================
# ПРАВИЛА ПОИСКА И ФИЛЬТРАЦИИ ВАКАНСИЙ (ДЛЯ РУКОВОДИТЕЛЯ ОТДЕЛА ПРОДАЖ)
# ==============================================================================

search:
  queries:
    - "Руководитель отдела продаж"
    - "РОП"
    - "Head of Sales"
    - "Руководитель группы продаж"
    - "Директор по продажам"

  area_id: 113 # Вся Россия
  only_remote: true
  order_by: "publication_time"
  experience:
    - "between3And6"
    - "moreThan6"

hard_stop_words:
  - "Оператор колл-центра"
  - "Оператор call-центра"
  - "Холодные звонки"
  - "Продавец-консультант"
  - "Курьер"
  - "Стажер"
  - "Стажировка"
  - "Менеджер без опыта"
  - "Сетевой маркетинг"
  - "Оклад 25000"
  - "Оклад 30000"
  - "Расклейщик"
  - "1С программист"

red_flag_phrases:
  - "оклад 20 000 + процент"
  - "работа за процент без оклада"
  - "самостоятельный поиск базы в полях"
  - "ненормированный рабочий день 24/7"
  - "система штрафов"
  - "серая зарплата"
  - "оплата в конверте"

thresholds:
  min_score_to_consider: 60
  min_score_for_nim_dossier: 70
