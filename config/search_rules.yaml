# ==============================================================================
# ПРАВИЛА ПОИСКА И ФИЛЬТРАЦИИ ВАКАНСИЙ (ДЛЯ AI / LLM / AGENTIC ИНЖЕНЕРА)
# ==============================================================================

search:
  queries:
    - "AI-инженер"
    - "Разработчик AI-агентов"
    - "LLM-инженер"
    - "AI Engineer"
    - "Prompt Engineer"
    - "ML Engineer LLM"
    - "Python AI"

  area_id: 113 # Вся Россия
  only_remote: true
  order_by: "publication_time"
  experience:
    - "between1And3"
    - "between3And6"

hard_stop_words:
  - "1C"
  - "1С"
  - "Битрикс"
  - "Bitrix"
  - "Junior"
  - "Джуниор"
  - "Стажер"
  - "Стажировка"
  - "Оператор колл-центра"
  - "Холодные звонки"
  - "Разметчик данных"
  - "Асессор"
  - "Data Entry"
  - "PHP"
  - "WordPress"

red_flag_phrases:
  - "оплата за процент от будущей прибыли"
  - "бесплатное тестовое задание на неделю"
  - "ненормированный рабочий день 24/7"
  - "серая зарплата"
  - "оплата в конверте"

thresholds:
  min_score_to_consider: 60
  min_score_for_nim_dossier: 70
